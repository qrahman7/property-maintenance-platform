spring:
  application:
    name: property-maintenance

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-6-luna

  jpa:
    open-in-view: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/property_maintenance}
    username: ${DB_USERNAME:property_app}
    password: ${DB_PASSWORD}
