services:
  postgres:
    image: postgres:17
    container_name: property-maintenance-postgres
    environment:
      POSTGRES_DB: property_maintenance
      POSTGRES_USER: property_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: